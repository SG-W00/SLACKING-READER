<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main.ts - slacking - Visual Studio Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 自定义标题栏 -->
    <div class="title-bar" id="titleBar">
        <div class="title-drag-area" id="dragArea">
            <span class="app-title"></span>
        </div>
        <div class="window-controls">
            <button class="control-btn minimize-btn" id="minimizeBtn" title="最小化">_</button>
            <button class="control-btn close-btn" id="closeBtn" title="关闭">×</button>
        </div>
    </div>
    
    <div class="app-container">
        <div class="toolbar" id="toolbar">
            <button class="toolbar-btn hidden-btn" id="importBtn" title="导入小说">+</button>
            <button class="toolbar-btn hidden-btn" id="backToShelfBtn" title="返回书架">←</button>
            <button class="toolbar-btn hidden-btn" id="prevChapterBtn" title="上一章">&lt;</button>
            <select class="chapter-select toolbar-chapter-select" id="chapterSelect"></select>
            <button class="toolbar-btn hidden-btn" id="nextChapterBtn" title="下一章">&gt;</button>
            <button class="toolbar-btn hidden-btn" id="settingsBtn" title="设置">≡</button>
            <button class="toolbar-btn hidden-btn" id="pinBtn" title="置顶">◉</button>
        </div>
        
        <div class="main-content" id="mainContent" tabindex="-1">
            <!-- 空状态/书架列表 -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">/* */</div>
                <p>按 + 号导入代码文件</p>
                <p class="hint">支持 .txt 格式</p>
            </div>

            <!-- 书架列表 -->
            <div class="bookshelf" id="bookshelf" style="display: none;">
                <div class="bookshelf-header">
                    <h2>/* Bookshelf */</h2>
                </div>
                <div class="book-list" id="bookList"></div>
            </div>

            <!-- 阅读器 -->
            <div class="reader" id="reader" style="display: none;">
                <div class="content" id="content"></div>
                <div class="page-info" id="pageInfo">
                    <span id="chapterInfo">1 / 1</span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header">
            <h2>/* Settings */</h2>
            <button class="close-panel-btn" id="closeSettingsBtn">×</button>
        </div>
        
        <div class="panel-content">
            <div class="setting-group">
                <h3>// Window Settings</h3>
                <div class="setting-item">
                    <label>Opacity: <span id="opacityValue">100%</span></label>
                    <input type="range" id="windowOpacity" min="30" max="100" value="100">
                </div>
                <div class="setting-item">
                    <label>Transparent Mode</label>
                    <label class="switch">
                        <input type="checkbox" id="transparentMode">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="setting-group">
                <h3>// Text Settings</h3>
                <div class="setting-item">
                    <label>Font Size: <span id="fontSizeValue">14px</span></label>
                    <input type="range" id="fontSize" min="11" max="20" value="14">
                </div>
                <div class="setting-item">
                    <label>Text Color:</label>
                    <input type="color" id="textColor" value="#858585">
                </div>
                <div class="setting-item">
                    <label>Line Height: <span id="lineHeightValue">1.6</span></label>
                    <input type="range" id="lineHeight" min="1.4" max="2.0" step="0.1" value="1.6">
                </div>
            </div>
            
            <div class="setting-group">
                <h3>// Background</h3>
                <div class="setting-item">
                    <label>Background Color:</label>
                    <input type="color" id="bgColor" value="#1e1e1e">
                </div>
                <div class="setting-item">
                    <label>Content Opacity: <span id="contentOpacityValue">95%</span></label>
                    <input type="range" id="contentOpacity" min="70" max="100" value="95">
                </div>
            </div>

            <div class="setting-group">
                <h3>// Stealth</h3>
                <div class="setting-item">
                    <label>Disguise chapter names as file paths</label>
                    <label class="switch">
                        <input type="checkbox" id="stealthNames" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <label>Boss Key (hide/show)</label>
                    <select id="bossHotkeySelect" class="setting-select">
                        <option value="Alt+Q">Alt+Q</option>
                        <option value="Ctrl+Q">Ctrl+Q</option>
                        <option value="Alt+B">Alt+B</option>
                        <option value="Ctrl+Shift+Q">Ctrl+Shift+Q</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Chapter Nav Keys</label>
                    <select id="chapterHotkeySelect" class="setting-select">
                        <option value="AltShift">Alt+Shift+&larr;/&rarr;</option>
                        <option value="CtrlShift">Ctrl+Shift+&larr;/&rarr;</option>
                        <option value="CtrlAlt">Ctrl+Alt+&larr;/&rarr;</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label style="color: #6e7681; font-size: 11px;">Disguise: right-click / Q &nbsp;|&nbsp; Hide: Boss Key &nbsp;|&nbsp; Immersive: H</label>
                </div>
            </div>
            
            <div class="setting-group">
                <button class="reset-btn" id="resetBtn">Reset</button>
            </div>
        </div>
    </div>
    
    <input type="file" id="fileInput" accept=".txt" style="display: none;">

    <!-- 沉浸模式右下角窗口调整手柄 -->
    <div class="resize-handle" id="resizeHandle" title="resize"></div>

    <!-- 悬浮层必须挂在 body 直下：阅读区的 backdrop-filter 会劫持内部 fixed 元素的定位基准，
         导致进度条/提示跑到滚动内容底部随内容滚动 -->
    <!-- 到底后二次滚动翻章提示 -->
    <div class="next-hint" id="nextHint">&#9662; scroll for next</div>
    <!-- 全书进度条（视口底部细线） -->
    <div class="global-progress"><div class="global-progress-fill" id="globalProgressFill"></div></div>
    <!-- 沉浸模式进入提示 -->
    <div class="immersive-hint" id="immersiveHint">press H to restore</div>
    
    <script src="app.js"></script>
</body>
</html>
